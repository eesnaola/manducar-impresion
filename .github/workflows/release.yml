name: release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # Pinneada a propósito: los hashes que se publican tienen que salir
        # siempre del mismo compilador. Con 'stable' y check-latest, el mismo
        # tag compilado dos veces puede dar dos binarios distintos.
        with: { go-version: '1.23.x', check-latest: false }
      - run: go test -race ./...
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: build
        run: |
          set -e
          V=${GITHUB_REF_NAME#v}
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          TARGETS="windows-amd64 darwin-arm64 linux-amd64"
          mkdir -p dist
          for t in $TARGETS; do
            os=${t%-*}; arch=${t#*-}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.Version=$V" -o dist/manducar-impresion-$t$ext .
          done
          (cd dist && sha256sum manducar-impresion-* > SHA256SUMS)
          # El bloque de printing.yaml sale de acá, de los binarios que se
          # publican, y va en el cuerpo del release: los hashes de una build
          # local son de otro binario y no sirven para el servidor.
          {
            echo "Para que el panel ofrezca esta versión, pegá este bloque en \`config/packages/printing.yaml\` de manducar:"
            echo
            echo '```yaml'
            echo "    printing.agent.version: '$V'"
            echo "    printing.agent.downloads:"
            for t in $TARGETS; do
              os=${t%-*}; ext=""; [ "$os" = windows ] && ext=".exe"
              f=manducar-impresion-$t$ext
              h=$(grep " $f\$" dist/SHA256SUMS | cut -d' ' -f1)
              echo "        $t:"
              echo "            url: '$REPO/releases/download/v$V/$f'"
              echo "            sha256: '$h'"
            done
            echo '```'
          } > dist/notas.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: dist/notas.md
          files: |
            dist/manducar-impresion-*
            dist/SHA256SUMS
