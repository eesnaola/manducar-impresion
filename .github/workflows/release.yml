name: release
on:
  push:
    tags: ['v*']
env:
  TARGETS: windows-amd64 darwin-arm64 linux-amd64
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # Pinneada a propósito: los hashes que se publican tienen que salir
        # siempre del mismo compilador. Con 'stable' y check-latest, el mismo
        # tag compilado dos veces puede dar dos binarios distintos.
        with: { go-version: '1.23.x', check-latest: false }
      - run: go test -race ./...
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - name: build
        run: |
          set -e
          V=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for t in $TARGETS; do
            os=${t%-*}; arch=${t#*-}; ext=""; [ "$os" = windows ] && ext=".exe"
            # En Mac, con el LC_UUID: Go 1.23 no lo pone solo, y macOS 15 lo
            # usa para el permiso de «Red local». Sin él el agente puede
            # quedarse sin llegar a las impresoras de red (golang/go#68678).
            # armar-app.sh no empaqueta un binario que no lo traiga.
            uuid=""; [ "$os" = darwin ] && uuid="-B gobuildid"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w $uuid -X main.Version=$V" -o dist/manducar-impresion-$t$ext .
          done
      - uses: actions/upload-artifact@v4
        with: { name: binarios, path: dist/, if-no-files-found: error }

  # Mac: además del binario crudo (que es lo que baja el agente para
  # actualizarse, con su sha256), un .zip para el humano con el mismo binario
  # adentro de «Manducar Impresión.app»: el navegador le saca el permiso de
  # ejecución a un binario suelto, el zip lo conserva, y con el .app el doble
  # clic no abre la Terminal sino el cuadro que pide el código.
  #
  # Se arma en una Mac porque el .app va sellado con codesign. Armado en
  # Linux salía sin sellar, y a quien lo bajaba macOS le decía «está dañado y
  # no puede abrirse». El script revisa el sello en lo que sale del zip: si no
  # cierra, este job falla y no se publica nada.
  mac-app:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: binarios, path: dist }
      - run: packaging/mac/armar-app.sh dist/manducar-impresion-darwin-arm64 "${GITHUB_REF_NAME#v}" dist/manducar-impresion-mac.zip
      - uses: actions/upload-artifact@v4
        with: { name: mac-app, path: dist/manducar-impresion-mac.zip, if-no-files-found: error }

  release:
    needs: [build, mac-app]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: notas
        run: |
          set -e
          V=${GITHUB_REF_NAME#v}
          REPO="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          (cd dist && sha256sum manducar-impresion-* > SHA256SUMS)
          # La entrada del catálogo de printing.yaml sale de acá, de los
          # binarios que se publican, y va en el cuerpo del release: los
          # hashes de una build local son de otro binario y no sirven para el
          # servidor.
          {
            echo "Para que el servidor conozca esta versión, pegá esta entrada arriba de todo en \`printing.agent.releases\` (\`config/packages/printing.yaml\` de manducar) y deployá. Después se pone en prueba o se hace vigente desde plataforma, «Agente de impresión», sin otro push:"
            echo
            echo '```yaml'
            echo "        '$V':"
            for t in $TARGETS; do
              os=${t%-*}; ext=""; [ "$os" = windows ] && ext=".exe"
              f=manducar-impresion-$t$ext
              h=$(grep " $f\$" dist/SHA256SUMS | cut -d' ' -f1)
              echo "            $t:"
              echo "                url: '$REPO/releases/download/v$V/$f'"
              echo "                sha256: '$h'"
              [ "$os" = darwin ] && echo "                descarga: '$REPO/releases/download/v$V/manducar-impresion-mac.zip'"
            done
            echo '```'
          } > dist/notas.md
      - uses: softprops/action-gh-release@v2
        with:
          # Un tag -rc es para probar (SmartScreen, autoactualización): queda
          # como pre-release y no se vuelve el «latest» que ve la gente.
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          body_path: dist/notas.md
          files: |
            dist/manducar-impresion-*
            dist/SHA256SUMS
